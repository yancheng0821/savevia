server:
  port: 8083

spring:
  application:
    name: savevia-optimizer
  datasource:
    url: jdbc:mysql://localhost:3306/savevia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: savevia
    password: savevia123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

logging:
  level:
    com.savevia.optimizer: DEBUG
