# Production profile for Optimizer Service
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

openai:
  api:
    key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  enabled: ${OPENAI_ENABLED:true}

app:
  base-url: https://savevia.app
  frontend-url: https://savevia.app

flinks:
  api:
    base-url: ${FLINKS_API_URL}
    customer-id: ${FLINKS_CUSTOMER_ID}
    iframe-url: ${FLINKS_IFRAME_URL}
  sandbox:
    enabled: ${FLINKS_SANDBOX:false}

logging:
  level:
    root: INFO
    com.savevia.optimizer: INFO
    com.savevia.optimizer.mapper: WARN
