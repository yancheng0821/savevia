version: '3.8'

services:
  # ==================== Message Queue ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: savevia-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - savevia-network
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Service Discovery ====================
  eureka-server:
    image: savevia/eureka-server:latest
    container_name: savevia-eureka
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_USER=${EUREKA_USER}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD}
      - LOGGING_FILE_PATH=/app/logs
    ports:
      - "8761:8761"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - savevia-network
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== API Gateway ====================
  gateway:
    image: savevia/gateway:latest
    container_name: savevia-gateway
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_USER=${EUREKA_USER}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - LOGGING_FILE_PATH=/app/logs
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - savevia-network
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== User Service ====================
  user-service:
    image: savevia/user-service:latest
    container_name: savevia-user
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_USER=${EUREKA_USER}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - AI_MONTHLY_LIMIT=${AI_MONTHLY_LIMIT}
      - AWS_S3_AVATAR_BUCKET=${AWS_S3_AVATAR_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - APP_VERSION_LATEST=${APP_VERSION_LATEST}
      - APP_VERSION_MIN=${APP_VERSION_MIN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_TOKEN_SECRET=${ADMIN_TOKEN_SECRET}
      - LOGGING_FILE_PATH=/app/logs
      # APNs Push Notification
      - APNS_ENABLED=${APNS_ENABLED:-false}
      - APNS_PRODUCTION=${APNS_PRODUCTION:-false}
      - APNS_KEY_ID=${APNS_KEY_ID}
      - APNS_TEAM_ID=${APNS_TEAM_ID}
      - APNS_KEY_PATH=${APNS_KEY_PATH:-/app/keys/AuthKey.p8}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-com.savevia.app}
    ports:
      - "8081:8081"
    volumes:
      - uploads-data:/app/uploads
      - ./logs:/app/logs
      - ./keys:/app/keys:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - savevia-network
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Card Service ====================
  card-service:
    image: savevia/card-service:latest
    container_name: savevia-card
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_USER=${EUREKA_USER}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - LOGGING_FILE_PATH=/app/logs
    ports:
      - "8082:8082"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - savevia-network
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Optimizer Service ====================
  optimizer-service:
    image: savevia/optimizer-service:latest
    container_name: savevia-optimizer
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_USER=${EUREKA_USER}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_ENABLED=${OPENAI_ENABLED}
      - FLINKS_API_URL=${FLINKS_API_URL}
      - FLINKS_CUSTOMER_ID=${FLINKS_CUSTOMER_ID}
      - FLINKS_IFRAME_URL=${FLINKS_IFRAME_URL}
      - FLINKS_SANDBOX=${FLINKS_SANDBOX}
      - LOGGING_FILE_PATH=/app/logs
    ports:
      - "8083:8083"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - savevia-network
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  savevia-network:
    driver: bridge

volumes:
  rabbitmq-data:
  uploads-data:
