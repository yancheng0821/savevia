# Production profile for Gateway
spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://savevia.app"
              - "https://www.savevia.app"
              - "capacitor://localhost"
              - "http://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: WARN
    com.savevia.gateway.filter: INFO
    com.savevia.gateway.service: INFO

# Production security settings
savevia:
  security:
    rate-limit:
      enabled: true
      block-threshold: 30  # Block IP after 30 rate limit violations in 1 minute (more lenient for legitimate users)
    bot-detection:
      enabled: true
      block-empty-ua: true
    ip-block:
      enabled: true
      first-block-minutes: 5
      second-block-minutes: 60
      third-block-minutes: 1440  # 24 hours
