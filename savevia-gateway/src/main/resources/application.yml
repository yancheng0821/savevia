server:
  port: 8080
  netty:
    max-initial-line-length: 65536
    max-chunk-size: 65536

spring:
  codec:
    max-in-memory-size: 10MB
  application:
    name: savevia-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://192.168.1.196:5173"
              - "capacitor://localhost"
              - "http://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # App Service - Version check (public, no auth required)
        - id: app-service
          uri: lb://savevia-user
          predicates:
            - Path=/api/v1/app/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Admin Service - Statistics and tracking (public login/track, token for stats)
        - id: admin-service
          uri: lb://savevia-user
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # User Service - Auth endpoints (strict rate limit)
        - id: auth-service
          uri: lb://savevia-user
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 50
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # User Service - User endpoints
        - id: user-service
          uri: lb://savevia-user
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Card Service
        - id: card-service
          uri: lb://savevia-card
          predicates:
            - Path=/api/v1/cards/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Chat Service - SSE stream (Python: savevia-ai)
        - id: chat-stream
          uri: ${SAVEVIA_AI_URL:http://savevia-ai:8002}
          predicates:
            - Path=/api/v1/chat/stream
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Chat Service - Suggestions (Python: savevia-ai)
        - id: chat-suggestions
          uri: ${SAVEVIA_AI_URL:http://savevia-ai:8002}
          predicates:
            - Path=/api/v1/chat/suggestions
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Chat Service - Conversations (goes to user service)
        - id: chat-conversations
          uri: lb://savevia-user
          predicates:
            - Path=/api/v1/chat/conversations/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Optimizer Service - Bank/Flinks endpoints (stays on Java optimizer)
        # IMPORTANT: this route must appear BEFORE the Python-bound optimizer
        # routes so Spring Cloud Gateway's first-match wins on /optimize/bank/**.
        - id: optimizer-bank
          uri: lb://savevia-optimizer
          predicates:
            - Path=/api/v1/optimize/bank/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Optimizer Service - Calculate endpoint (Python: savevia-ai, strict limit)
        - id: optimizer-calculate
          uri: ${SAVEVIA_AI_URL:http://savevia-ai:8002}
          predicates:
            - Path=/api/v1/optimize/calculate
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Optimizer Service - Other endpoints (Python: savevia-ai)
        # Covers /optimize/transactions/**, /optimize/share/**, /optimize/user-result/**.
        # /optimize/bank/** is caught by the optimizer-bank route above.
        - id: optimizer-service
          uri: ${SAVEVIA_AI_URL:http://savevia-ai:8002}
          predicates:
            - Path=/api/v1/optimize/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Static uploads (avatars, etc.)
        - id: uploads
          uri: lb://savevia-user
          predicates:
            - Path=/uploads/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
    # Faster service discovery refresh
    registry-fetch-interval-seconds: 5
    # Enable fetching registry from Eureka
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # Faster heartbeat for quicker detection of service changes
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Load balancer configuration for better resilience
spring.cloud.loadbalancer:
  # Use round-robin with health checks
  retry:
    enabled: true
  cache:
    # Shorter TTL for service instance cache (in ms)
    ttl: 5s
    # Shorter initial delay before cache refresh
    capacity: 256

jwt:
  secret: ${JWT_SECRET:savevia-jwt-secret-key-2024-must-be-at-least-256-bits-long}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

# Security settings
savevia:
  security:
    rate-limit:
      enabled: true
      block-threshold: 30  # Block IP after 30 rate limit violations in 1 minute (more lenient)
    bot-detection:
      enabled: true
      block-empty-ua: true
    ip-block:
      enabled: true
      first-block-minutes: 5
      second-block-minutes: 60
      third-block-minutes: 1440
