# Production profile for User Service
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

# File storage - S3 for production
file:
  storage-type: s3

aws:
  s3:
    bucket: ${AWS_S3_AVATAR_BUCKET:savevia-avatars}
    region: ${AWS_REGION:ca-central-1}
    base-url: ${AWS_S3_BASE_URL:}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7天 (毫秒)
  refresh-expiration: 2592000000  # 30天 (毫秒)

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  ios-client-id: ${GOOGLE_IOS_CLIENT_ID}

apple:
  client-id: ${APPLE_CLIENT_ID}

app:
  frontend-url: ${FRONTEND_URL:https://savevia.app}
  version:
    latest: ${APP_VERSION_LATEST}
    min: ${APP_VERSION_MIN}
    ios-store-url: https://apps.apple.com/app/id6756332569
    android-store-url: https://play.google.com/store/apps/details?id=app.savevia

ai:
  usage:
    monthly-limit: ${AI_MONTHLY_LIMIT:100}

logging:
  level:
    root: INFO
    com.savevia.user: INFO
    com.savevia.user.mapper: WARN
