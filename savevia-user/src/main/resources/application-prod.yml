# Production profile for User Service
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

# File storage - S3 for production
file:
  storage-type: s3

aws:
  s3:
    bucket: ${AWS_S3_AVATAR_BUCKET:savevia-avatars}
    region: ${AWS_REGION:ca-central-1}
    base-url: ${AWS_S3_BASE_URL:}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  ios-client-id: ${GOOGLE_IOS_CLIENT_ID}

apple:
  client-id: ${APPLE_CLIENT_ID}

app:
  frontend-url: ${FRONTEND_URL:https://savevia.app}

ai:
  usage:
    monthly-limit: ${AI_MONTHLY_LIMIT:100}

logging:
  level:
    root: INFO
    com.savevia.user: INFO
    com.savevia.user.mapper: WARN
