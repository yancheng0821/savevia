server:
  port: 8081

spring:
  application:
    name: savevia-user
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:savevia}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: ${MYSQL_USER:savevia}
    password: ${MYSQL_PASSWORD:savevia123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.savevia.user.entity
  configuration:
    map-underscore-to-camel-case: true
    default-time-zone: UTC
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:savevia-jwt-secret-key-2024-must-be-at-least-256-bits-long}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:890444343202-ju6uie2f6vuk53ccbeoqa4eitrmtslhr.apps.googleusercontent.com}
  client-secret: ${GOOGLE_CLIENT_SECRET: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}
  ios-client-id: ${GOOGLE_IOS_CLIENT_ID:890444343202-npol552p21etjqs53homftgo6430g4qo.apps.googleusercontent.com}
  play:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.savevia.app}
    service-account-key: ${GOOGLE_PLAY_SERVICE_ACCOUNT_KEY:}

apple:
  client-id: ${APPLE_CLIENT_ID:com.savevia.app}
  iap:
    shared-secret: ${APPLE_IAP_SHARED_SECRET:}
    sandbox: ${APPLE_IAP_SANDBOX:true}

file:
  upload-dir: ./uploads
  storage-type: local

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 10MB

# Mail configuration
spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# Application URLs
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# AI Usage Limits
ai:
  usage:
    monthly-limit: ${AI_MONTHLY_LIMIT:100}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    com.savevia.user: DEBUG
    com.savevia.user.mapper: DEBUG
