server:
  port: 8082

spring:
  application:
    name: savevia-card
  datasource:
    url: jdbc:mysql://localhost:3306/savevia?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: savevia
    password: savevia123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.savevia.card.entity
  configuration:
    map-underscore-to-camel-case: true
    default-time-zone: UTC
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  file:
    path: ./logs
  level:
    com.savevia.card: DEBUG
    com.savevia.card.mapper: DEBUG
