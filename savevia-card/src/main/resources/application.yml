server:
  port: 8082

spring:
  application:
    name: savevia-card
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:savevia}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: ${MYSQL_USER:savevia}
    password: ${MYSQL_PASSWORD:savevia123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.savevia.card.entity
  configuration:
    map-underscore-to-camel-case: true
    default-time-zone: UTC
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.savevia.card: DEBUG
    com.savevia.card.mapper: DEBUG
