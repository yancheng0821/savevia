<svg width="120" height="120" viewBox="3 8 107 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="15" y="12" width="85" height="54" rx="10" transform="rotate(6 15 12)" fill="url(#gradient1)"/>

  <!-- Middle Card -->
  <rect x="10" y="30" width="85" height="54" rx="10" transform="rotate(-3 10 30)" fill="url(#gradient2)"/>

  <!-- Front Card -->
  <rect x="17" y="45" width="85" height="54" rx="10" fill="url(#gradient3)"/>

  <!-- CASHBACK label -->
  <text x="28" y="60" fill="rgba(255,255,255,0.7)" font-family="Inter, Arial, sans-serif" font-size="7" font-weight="500" letter-spacing="0.5">CASHBACK</text>

  <!-- 5% rate -->
  <text x="28" y="76" fill="white" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">5%</text>

  <!-- Card number -->
  <text x="28" y="92" fill="rgba(255,255,255,0.8)" font-family="Inter, Arial, sans-serif" font-size="7">•••• •••• •••• 4242</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
  </defs>
</svg>
