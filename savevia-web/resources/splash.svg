<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="106" y="85" width="300" height="188" rx="24" transform="rotate(6 106 85)" fill="url(#splash1)"/>

  <!-- Middle Card -->
  <rect x="86" y="150" width="300" height="188" rx="24" transform="rotate(-3 86 150)" fill="url(#splash2)"/>

  <!-- Front Card -->
  <rect x="106" y="205" width="300" height="188" rx="24" fill="url(#splash3)"/>

  <!-- CASHBACK label -->
  <text x="140" y="255" fill="rgba(255,255,255,0.7)" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="1">CASHBACK</text>

  <!-- 5% rate -->
  <text x="140" y="310" fill="white" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">5%</text>

  <!-- Card number -->
  <text x="140" y="370" fill="rgba(255,255,255,0.8)" font-family="Inter, Arial, sans-serif" font-size="18">•••• •••• •••• 4242</text>

  <!-- SaveVia Text below cards -->
  <text x="256" y="460" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="url(#splashText)">SaveVia</text>

  <defs>
    <linearGradient id="splash1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <linearGradient id="splash2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <linearGradient id="splash3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    <linearGradient id="splashText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
</svg>