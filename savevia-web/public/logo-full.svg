<svg width="220" height="64" viewBox="0 0 220 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="5" y="4" width="44" height="28" rx="5" transform="rotate(8 5 4)" fill="url(#grad1)"/>

  <!-- Middle Card -->
  <rect x="3" y="14" width="44" height="28" rx="5" transform="rotate(-4 3 14)" fill="url(#grad2)"/>

  <!-- Front Card -->
  <rect x="7" y="22" width="44" height="28" rx="5" fill="url(#grad3)"/>

  <!-- Chip on front card -->
  <rect x="12" y="27" width="8" height="6" rx="1" fill="url(#chipGradient)"/>
  <line x1="12" y1="29.5" x2="20" y2="29.5" stroke="#c9a227" stroke-width="0.3" opacity="0.5"/>
  <line x1="12" y1="31.5" x2="20" y2="31.5" stroke="#c9a227" stroke-width="0.3" opacity="0.5"/>
  <line x1="16" y1="27" x2="16" y2="33" stroke="#c9a227" stroke-width="0.3" opacity="0.5"/>

  <!-- CASHBACK label -->
  <text x="12" y="38" fill="rgba(255,255,255,0.7)" font-family="Inter, Arial, sans-serif" font-size="3" font-weight="600" letter-spacing="0.2">CASHBACK</text>

  <!-- 5% rate -->
  <text x="12" y="46" fill="white" font-family="Inter, Arial, sans-serif" font-size="6" font-weight="700">5%</text>

  <!-- Small sparkle - positioned to the right top of the card -->
  <path d="M46 26 L47 28 L49 29 L47 30 L46 32 L45 30 L43 29 L45 28 Z" fill="white" opacity="0.7"/>

  <!-- SaveVia Text with gradient -->
  <text x="60" y="42" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-1" fill="url(#textGradient)">SaveVia</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
</svg>
