<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="25" y="20" width="70" height="44" rx="8" transform="rotate(6 25 20)" fill="url(#gradient1)"/>

  <!-- Middle Card -->
  <rect x="20" y="35" width="70" height="44" rx="8" transform="rotate(-3 20 35)" fill="url(#gradient2)"/>

  <!-- Front Card -->
  <rect x="25" y="48" width="70" height="44" rx="8" fill="url(#gradient3)"/>

  <!-- CASHBACK label -->
  <text x="33" y="60" fill="rgba(255,255,255,0.7)" font-family="Inter, Arial, sans-serif" font-size="6" font-weight="500" letter-spacing="0.5">CASHBACK</text>

  <!-- 5% rate -->
  <text x="33" y="70" fill="white" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700">5%</text>

  <!-- Card number -->
  <text x="33" y="88" fill="rgba(255,255,255,0.8)" font-family="Inter, Arial, sans-serif" font-size="6">•••• •••• •••• 4242</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
  </defs>
</svg>