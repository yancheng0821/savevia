<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="18" y="13" width="75" height="47" rx="8" transform="rotate(8 18 13)" fill="url(#gradient1)"/>

  <!-- Middle Card -->
  <rect x="15" y="27" width="75" height="47" rx="8" transform="rotate(-4 15 27)" fill="url(#gradient2)"/>

  <!-- Front Card -->
  <rect x="22" y="39" width="75" height="47" rx="8" fill="url(#gradient3)"/>

  <!-- Chip on front card -->
  <rect x="30" y="47" width="13" height="10" rx="2" fill="url(#chipGradient)"/>
  <line x1="30" y1="51" x2="43" y2="51" stroke="#c9a227" stroke-width="0.5" opacity="0.5"/>
  <line x1="30" y1="54" x2="43" y2="54" stroke="#c9a227" stroke-width="0.5" opacity="0.5"/>
  <line x1="36.5" y1="47" x2="36.5" y2="57" stroke="#c9a227" stroke-width="0.5" opacity="0.5"/>

  <!-- CASHBACK label -->
  <text x="30" y="66" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="5" font-weight="600" letter-spacing="0.3">CASHBACK</text>

  <!-- 5% rate -->
  <text x="30" y="78" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="700">5%</text>

  <!-- Small sparkle - positioned to the right top of the card -->
  <path d="M88 45 L89 48 L92 49 L89 50 L88 53 L87 50 L84 49 L87 48 Z" fill="white" opacity="0.7"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
</svg>
